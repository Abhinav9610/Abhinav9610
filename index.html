<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Monsoon: Storm Runner</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f3ff">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 3D Canvas will be injected here -->
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen">
        <h1 class="neon-text">Neon Monsoon<br><span>Storm Runner</span></h1>

        <div class="menu-stats">
            <div class="stat-box">
                <span class="label">High Score</span>
                <span id="menu-high-score" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Neon Energy</span>
                <span id="menu-neon-energy" class="value neon-color">0</span>
            </div>
        </div>

        <button id="play-btn" class="neon-btn">PLAY</button>

        <div class="menu-options">
            <button id="character-btn" class="neon-btn-small">Character</button>
            <button id="missions-btn" class="neon-btn-small">Missions</button>
            <button id="settings-btn" class="neon-btn-small">Settings</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="screen hidden">
        <div class="hud-top">
            <div class="score-container">
                <span class="label">Score</span>
                <span id="hud-score" class="value">0</span>
            </div>
            <div class="energy-container">
                <span class="label">Energy</span>
                <span id="hud-energy" class="value neon-color">0</span>
            </div>
        </div>

        <button id="pause-btn" class="hud-btn">||</button>

        <div id="powerup-indicator" class="hidden">
            <span id="powerup-name">Shield</span>
            <div id="powerup-bar-container"><div id="powerup-bar"></div></div>
        </div>

        <div id="chase-warning" class="hidden neon-text-red">STORM GUARDIAN APPROACHING!</div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="screen hidden">
        <h2 class="neon-text">PAUSED</h2>
        <button id="resume-btn" class="neon-btn">RESUME</button>
        <button id="quit-btn" class="neon-btn-small">QUIT</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <h2 class="neon-text-red">CAUGHT BY THE STORM</h2>

        <div class="results-stats">
            <div class="stat-box">
                <span class="label">Score</span>
                <span id="result-score" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">High Score</span>
                <span id="result-high-score" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Energy Collected</span>
                <span id="result-energy" class="value neon-color">0</span>
            </div>
        </div>

        <button id="restart-btn" class="neon-btn">RESTART</button>
        <button id="home-btn" class="neon-btn-small">MAIN MENU</button>
    </div>

    <!-- Tutorial -->
    <div id="tutorial-overlay" class="screen hidden">
        <div class="tutorial-text" id="tutorial-text">Swipe to Move</div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
